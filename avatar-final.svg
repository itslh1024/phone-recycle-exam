<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <!-- 克莱因蓝渐变（国际克莱因蓝 #002FA7 风格） -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0033B0"/>
      <stop offset="50%" stop-color="#002FA7"/>
      <stop offset="100%" stop-color="#001E6B"/>
    </linearGradient>

    <!-- 波浪线渐变（底部装饰） -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ============ 背景层 ============ -->
  <rect x="0" y="0" width="640" height="640" rx="80" ry="80" fill="url(#bgGrad)"/>

  <!-- 底部 3 条波浪线 -->
  <g stroke="url(#waveGrad)" stroke-width="2" fill="none">
    <path d="M -20 595 Q 160 565 320 595 T 660 595"/>
    <path d="M -20 615 Q 160 585 320 615 T 660 615"/>
  </g>

  <!-- ============ 主元素层（安全区 80% 居中） ============ -->
  <!-- 手机外壳（线稿） -->
  <g stroke="#ffffff" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- 手机外框 -->
    <rect x="200" y="115" width="180" height="320" rx="22" ry="22"/>

    <!-- 顶部扬声器 -->
    <line x1="270" y1="135" x2="310" y2="135"/>

    <!-- 屏幕内框 -->
    <rect x="218" y="155" width="144" height="240" rx="4" ry="4"/>

    <!-- 底部 Home 键 -->
    <circle cx="290" cy="415" r="10"/>
  </g>

  <!-- ============ 屏幕内部电路板纹理 ============ -->
  <g stroke="#ffffff" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity="0.95">
    <!-- 上半部分（第 1 行）-->
    <path d="M 225 175 L 255 175 L 255 195 L 290 195 L 290 210 L 320 210"/>
    <circle cx="255" cy="175" r="4" fill="#002FA7"/>
    <circle cx="290" cy="195" r="4" fill="#002FA7"/>
    <circle cx="320" cy="210" r="4" fill="#002FA7"/>

    <!-- 第 2 行 -->
    <path d="M 225 200 L 245 200 L 245 225 L 275 225"/>
    <circle cx="245" cy="200" r="4" fill="#002FA7"/>
    <circle cx="275" cy="225" r="4" fill="#002FA7"/>

    <!-- 第 3 行 -->
    <path d="M 225 240 L 265 240 L 265 260 L 305 260 L 305 275"/>
    <circle cx="265" cy="240" r="4" fill="#002FA7"/>
    <circle cx="305" cy="275" r="4" fill="#002FA7"/>

    <!-- 第 4 行 -->
    <path d="M 225 265 L 250 265 L 250 290 L 285 290"/>
    <circle cx="250" cy="265" r="4" fill="#002FA7"/>
    <circle cx="285" cy="290" r="4" fill="#002FA7"/>

    <!-- 第 5 行 -->
    <path d="M 225 300 L 270 300 L 270 320 L 315 320"/>
    <circle cx="270" cy="300" r="4" fill="#002FA7"/>
    <circle cx="315" cy="320" r="4" fill="#002FA7"/>

    <!-- 第 6 行 -->
    <path d="M 225 330 L 250 330 L 250 355 L 290 355 L 290 370"/>
    <circle cx="250" cy="330" r="4" fill="#002FA7"/>
    <circle cx="290" cy="370" r="4" fill="#002FA7"/>

    <!-- 下半部分 -->
    <path d="M 225 365 L 260 365 L 260 385 L 320 385"/>
    <circle cx="260" cy="365" r="4" fill="#002FA7"/>
    <circle cx="320" cy="385" r="4" fill="#002FA7"/>
  </g>

  <!-- ============ 十字螺丝刀（X 形叠加） ============ -->
  <g stroke="#ffffff" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- 螺丝刀 1：从左上到右下（rotate 50°）-->
    <g transform="translate(440, 180) rotate(50)">
      <rect x="-15" y="-12" width="30" height="24"/>
      <line x1="-15" y1="0" x2="15" y2="0" stroke-width="4"/>
      <line x1="0" y1="-12" x2="0" y2="12" stroke-width="4"/>
      <rect x="15" y="-6" width="80" height="12"/>
      <rect x="95" y="-9" width="60" height="18" rx="2"/>
      <line x1="105" y1="-9" x2="105" y2="9" stroke-width="2"/>
      <line x1="115" y1="-9" x2="115" y2="9" stroke-width="2"/>
      <line x1="125" y1="-9" x2="125" y2="9" stroke-width="2"/>
      <line x1="135" y1="-9" x2="135" y2="9" stroke-width="2"/>
      <line x1="145" y1="-9" x2="145" y2="9" stroke-width="2"/>
      <circle cx="160" cy="0" r="6" fill="#ffffff"/>
    </g>

    <!-- 螺丝刀 2：从右上到左下（rotate 130°） -->
    <g transform="translate(440, 180) rotate(130)">
      <rect x="-15" y="-12" width="30" height="24"/>
      <line x1="-15" y1="0" x2="15" y2="0" stroke-width="4"/>
      <line x1="0" y1="-12" x2="0" y2="12" stroke-width="4"/>
      <rect x="15" y="-6" width="80" height="12"/>
      <rect x="95" y="-9" width="60" height="18" rx="2"/>
      <line x1="105" y1="-9" x2="105" y2="9" stroke-width="2"/>
      <line x1="115" y1="-9" x2="115" y2="9" stroke-width="2"/>
      <line x1="125" y1="-9" x2="125" y2="9" stroke-width="2"/>
      <line x1="135" y1="-9" x2="135" y2="9" stroke-width="2"/>
      <line x1="145" y1="-9" x2="145" y2="9" stroke-width="2"/>
      <circle cx="160" cy="0" r="6" fill="#ffffff"/>
    </g>
  </g>

  <!-- ============ 副标题（上移到 y=560，给底部留呼吸感） ============ -->
  <text x="320" y="555" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="500" fill="#ffffff" fill-opacity="0.92" text-anchor="middle" letter-spacing="2">3C 数码 · 维修 · 资讯</text>
</svg>
