<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <linearGradient id="bgGradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- 背景：深邃黑蓝渐变 -->
  <rect x="0" y="0" width="640" height="640" rx="80" ry="80" fill="url(#bgGradC)"/>

  <!-- 装饰：科技感线条 -->
  <g opacity="0.2" stroke="#3b82f6" stroke-width="1.5" fill="none">
    <line x1="60" y1="60" x2="120" y2="60"/>
    <line x1="60" y1="60" x2="60" y2="120"/>
    <line x1="580" y1="60" x2="520" y2="60"/>
    <line x1="580" y1="60" x2="580" y2="120"/>
    <line x1="60" y1="580" x2="120" y2="580"/>
    <line x1="60" y1="580" x2="60" y2="520"/>
    <line x1="580" y1="580" x2="520" y2="580"/>
    <line x1="580" y1="580" x2="580" y2="520"/>
  </g>

  <!-- 中心品牌字（最大识别元素） -->
  <g transform="translate(320, 320)">
    <!-- 主字符：抽象组合「R+M」（Recycle + Maintenance 缩写）-->
    <text x="0" y="0" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="220" font-weight="900" fill="url(#textGrad)" text-anchor="middle" dominant-baseline="middle" letter-spacing="-8">RM</text>
  </g>

  <!-- 顶部小标识：行业标识 -->
  <g transform="translate(320, 80)">
    <rect x="-90" y="-20" width="180" height="40" rx="20" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="0" y="0" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="600" fill="#60a5fa" text-anchor="middle" dominant-baseline="middle" letter-spacing="2">手机 · 资讯</text>
  </g>

  <!-- 底部副标题：行业全称 -->
  <text x="320" y="595" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="500" fill="#94a3b8" text-opacity="0.9" text-anchor="middle" letter-spacing="3">RECYCLE  ·  MAINTENANCE</text>
</svg>
