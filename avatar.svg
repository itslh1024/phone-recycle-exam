<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <!-- 背景渐变：蓝白 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>

    <!-- 试卷条纹底纹 -->
    <pattern id="paperPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>

    <!-- 内圆渐变（白色考试卷感） -->
    <radialGradient id="paperGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </radialGradient>
  </defs>

  <!-- 背景：蓝色圆角方形（公众号方形头像全图） -->
  <rect x="0" y="0" width="640" height="640" rx="80" ry="80" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="640" height="640" rx="80" ry="80" fill="url(#paperPattern)"/>

  <!-- 中心考试卷（白色圆角方形，居中、安全区避开圆形裁切） -->
  <!-- 圆形裁切会把四角切掉，所以安全区是中央 80%（512x512） -->
  <g transform="translate(160, 160)">
    <!-- 试卷本体 -->
    <rect x="0" y="0" width="320" height="320" rx="28" ry="28" fill="url(#paperGrad)" stroke="#e5e7eb" stroke-width="2"/>

    <!-- 试卷顶部装订线（红色） -->
    <rect x="40" y="50" width="240" height="3" fill="#ef4444" rx="1.5"/>
    <circle cx="50" cy="80" r="4" fill="#ef4444" fill-opacity="0.6"/>
    <circle cx="50" cy="100" r="4" fill="#ef4444" fill-opacity="0.6"/>
    <circle cx="50" cy="120" r="4" fill="#ef4444" fill-opacity="0.6"/>

    <!-- 试卷内容区：模拟横线 -->
    <line x1="60" y1="100" x2="260" y2="100" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="60" y1="125" x2="240" y2="125" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="60" y1="150" x2="260" y2="150" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="60" y1="175" x2="220" y2="175" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- 中心大数字：100（核心识别元素） -->
    <g transform="translate(160, 220)">
      <text x="0" y="0" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif" font-size="120" font-weight="900" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" letter-spacing="-4">100</text>
    </g>

    <!-- 顶部小标签：EXAM 2026 -->
    <g transform="translate(160, 65)">
      <rect x="-50" y="-15" width="100" height="22" rx="11" fill="#2563eb"/>
      <text x="0" y="0" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" letter-spacing="1.5">EXAM 2026</text>
    </g>

    <!-- 底部装饰：3 个小方块代表 3 类题型 -->
    <g transform="translate(105, 285)">
      <rect x="0" y="0" width="20" height="20" rx="4" fill="#2563eb"/>
      <rect x="55" y="0" width="20" height="20" rx="4" fill="#2563eb" fill-opacity="0.5"/>
      <rect x="110" y="0" width="20" height="20" rx="4" fill="#2563eb" fill-opacity="0.3"/>
    </g>
  </g>

  <!-- 顶部小标记：标题前缀 -->
  <text x="320" y="80" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="600" fill="#ffffff" fill-opacity="0.7" text-anchor="middle" letter-spacing="2">PHONE RECYCLE</text>

  <!-- 底部小标记：副标题 -->
  <text x="320" y="595" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="500" fill="#ffffff" fill-opacity="0.6" text-anchor="middle" letter-spacing="3">回收维修 · 模拟卷</text>
</svg>
