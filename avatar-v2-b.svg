<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <linearGradient id="bgGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- 背景：工业橙渐变 -->
  <rect x="0" y="0" width="640" height="640" rx="80" ry="80" fill="url(#bgGradB)"/>

  <!-- 装饰：背景网格（工业感）-->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1" fill="none">
    <line x1="0" y1="100" x2="640" y2="100"/>
    <line x1="0" y1="200" x2="640" y2="200"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
    <line x1="0" y1="400" x2="640" y2="400"/>
    <line x1="0" y1="500" x2="640" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="640"/>
    <line x1="200" y1="0" x2="200" y2="640"/>
    <line x1="300" y1="0" x2="300" y2="640"/>
    <line x1="400" y1="0" x2="400" y2="640"/>
    <line x1="500" y1="0" x2="500" y2="640"/>
  </g>

  <!-- 中心组合：手机 + 扳手（安全区 80%） -->
  <g transform="translate(160, 140)">
    <!-- 手机（底层）-->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="200" height="320" rx="24" ry="24" fill="#ffffff" stroke="#92400e" stroke-width="4"/>
      <rect x="16" y="40" width="168" height="240" rx="6" ry="6" fill="#fbbf24" fill-opacity="0.2"/>
      <rect x="70" y="20" width="60" height="6" rx="3" fill="#92400e" fill-opacity="0.4"/>
      <circle cx="100" cy="295" r="10" fill="#92400e" fill-opacity="0.4"/>
    </g>

    <!-- 扳手（叠加在手机上，X 形）-->
    <g transform="translate(240, 60) rotate(45)">
      <!-- 扳手手柄 -->
      <rect x="0" y="0" width="180" height="22" rx="11" fill="#ffffff" stroke="#92400e" stroke-width="3"/>
      <!-- 扳手头部（左侧开口）-->
      <path d="M -10 11 L -25 11 L -25 -5 L -10 -5 Z" fill="#ffffff" stroke="#92400e" stroke-width="3"/>
      <path d="M -25 0 L -10 0" stroke="#92400e" stroke-width="3"/>
      <!-- 扳手头部（右侧开口）-->
      <path d="M 180 11 L 195 11 L 195 -5 L 180 -5 Z" fill="#ffffff" stroke="#92400e" stroke-width="3"/>
      <path d="M 195 0 L 180 0" stroke="#92400e" stroke-width="3"/>
    </g>

    <!-- 螺丝刀（叠加，X 形）-->
    <g transform="translate(240, 220) rotate(-45)">
      <rect x="0" y="0" width="140" height="14" rx="7" fill="#ffffff" stroke="#92400e" stroke-width="3"/>
      <!-- 螺丝刀头（十字）-->
      <rect x="-15" y="-3" width="20" height="20" fill="#ffffff" stroke="#92400e" stroke-width="3"/>
      <line x1="-12" y1="7" x2="2" y2="7" stroke="#92400e" stroke-width="2"/>
      <line x1="-5" y1="0" x2="-5" y2="14" stroke="#92400e" stroke-width="2"/>
    </g>
  </g>

  <!-- 顶部标题：REPAIR -->
  <text x="320" y="65" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="700" fill="#ffffff" fill-opacity="0.95" text-anchor="middle" letter-spacing="3">REPAIR</text>

  <!-- 底部副标题 -->
  <text x="320" y="600" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="500" fill="#ffffff" fill-opacity="0.85" text-anchor="middle" letter-spacing="2">维修 · 行业资讯</text>
</svg>
