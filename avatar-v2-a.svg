<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <linearGradient id="bgGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="phoneGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.85"/>
    </radialGradient>
  </defs>

  <!-- 背景：环保绿渐变 -->
  <rect x="0" y="0" width="640" height="640" rx="80" ry="80" fill="url(#bgGradA)"/>

  <!-- 装饰：底部波形线（暗示循环 / 可持续）-->
  <g opacity="0.15" stroke="#ffffff" stroke-width="3" fill="none">
    <path d="M 0 540 Q 160 500 320 540 T 640 540"/>
    <path d="M 0 570 Q 160 530 320 570 T 640 570"/>
    <path d="M 0 600 Q 160 560 320 600 T 640 600"/>
  </g>

  <!-- 中心手机剪影（安全区 80% = 512x512）-->
  <g transform="translate(220, 100)">
    <!-- 手机外壳 -->
    <rect x="0" y="0" width="200" height="380" rx="28" ry="28" fill="url(#phoneGlow)" stroke="#ffffff" stroke-width="4"/>
    <!-- 屏幕 -->
    <rect x="20" y="50" width="160" height="300" rx="8" ry="8" fill="#10b981" fill-opacity="0.1"/>

    <!-- 顶部扬声器 -->
    <rect x="80" y="20" width="40" height="6" rx="3" fill="#10b981" fill-opacity="0.3"/>
    <!-- Home 键 -->
    <circle cx="100" cy="365" r="10" fill="#10b981" fill-opacity="0.3"/>

    <!-- 屏幕上叠加：循环回收符号（最大可识别元素）-->
    <g transform="translate(100, 200)">
      <!-- ♻ 三箭头循环 -->
      <g fill="#10b981" stroke="#047857" stroke-width="2" stroke-linejoin="round">
        <!-- 上方箭头 -->
        <path d="M -50 -30 L -30 -50 L -10 -30 L -25 -30 L -25 0 L -35 0 L -35 -30 Z" />
        <!-- 右下箭头 -->
        <path d="M 50 30 L 30 50 L 10 30 L 25 30 L 25 0 L 35 0 L 35 30 Z" />
        <!-- 左下箭头 -->
        <path d="M -50 30 L -70 50 L -50 70 L -50 55 L -35 55 L -35 45 L -50 45 Z" />
      </g>
    </g>
  </g>

  <!-- 顶部标题：RECYCLE -->
  <text x="320" y="65" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="700" fill="#ffffff" fill-opacity="0.95" text-anchor="middle" letter-spacing="3">RECYCLE</text>

  <!-- 底部副标题：中文 -->
  <text x="320" y="600" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="500" fill="#ffffff" fill-opacity="0.85" text-anchor="middle" letter-spacing="2">二手手机 · 资讯</text>
</svg>
